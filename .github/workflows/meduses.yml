| **Mitigation** | • Hypothèses conservatrices (gains +10% remplissage vs +40% possible)<br>• Quick Wins M3 pour prouver valeur<br>• Budget Change Management 35K€<br>• Sponsorship DG actif<br>• Phase nettoyage 2 mois dédiée |
