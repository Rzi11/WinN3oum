## ANNEXE H : GLOSSAIRE BI & ACRONYMES

### 📚 TERMES BUSINESS INTELLIGENCE

| Terme | Définition | Exemple LAFABRIQUE |
|-------|------------|-------------------|
| **BI (Business Intelligence)** | Ensemble de technologies et processus permettant de transformer les données brutes en informations exploitables pour la prise de décision | Projet LAFABRIQUE Data Pilot |
| **Dashboard** | Tableau de bord visuel présentant des KPI et graphiques en temps réel | Dashboard Direction avec 12 KPI stratégiques |
| **KPI (Key Performance Indicator)** | Indicateur clé de performance mesurant l'atteinte d'objectifs stratégiques | Taux de remplissage, Taux de conversion |
| **ETL (Extract, Transform, Load)** | Processus d'extraction, transformation et chargement de données depuis les sources vers le système BI | Extraction SAGE → Transformation Power Query → Chargement Power BI |
| **Data Warehouse** | Entrepôt de données centralisé optimisé pour l'analyse | Modèle en étoile LAFABRIQUE (bien que simplifié) |
| **Star Schema (Modèle en Étoile)** | Architecture de données avec une table de faits centrale et des tables de dimensions | Fact_Inscriptions + Dim_Etudiant, Dim_Formation, etc. |
| **Dimension** | Table contenant des attributs descriptifs (Qui, Quoi, Où, Quand) | Dim_Etudiant (Nom, Prénom, Campus) |
| **Fait (Fact Table)** | Table contenant des mesures quantifiables et clés étrangères vers dimensions | Fact_Inscriptions (Nombre, CA, Date) |
| **DAX (Data Analysis Expressions)** | Langage de formules utilisé dans Power BI pour créer des mesures et colonnes calculées | `Taux Conversion = DIVIDE([Inscrits], [Prospects])` |
| **Power Query** | Outil ETL intégré à Power BI pour transformer les données | Nettoyage et dédoublonnage prospects |
| **Data Gateway** | Passerelle permettant la connexion sécurisée entre Power BI cloud et sources de données on-premise | Connexion Power BI ↔ SAGE Comptabilité |
| **RLS (Row-Level Security)** | Sécurité au niveau ligne permettant de filtrer les données selon l'utilisateur | Commerciaux voient uniquement leur portefeuille |
| **Drill-Down** | Action de creuser dans les données pour obtenir plus de détails | Clic sur Formation A → Liste des étudiants inscrits |
| **Drill-Through** | Navigation vers une page détaillée en cliquant sur un élément | Clic sur KPI Taux Placement → Page détails par formation |
| **Slicing** | Filtrage des données selon une dimension spécifique | Filtrer par Campus = "Paris" |
| **Measure (Mesure)** | Calcul dynamique évalué au moment de l'affichage | `CA Total = SUM(Fact_Inscriptions[CA])` |
| **Calculated Column** | Colonne calculée ajoutée à une table, évaluée une fois lors du rafraîchissement | `Age = YEAR(TODAY()) - YEAR([DateNaissance])` |
| **Refresh (Rafraîchissement)** | Mise à jour des données dans Power BI depuis les sources | Rafraîchissement quotidien à 6h du matin |
| **Workspace** | Espace de travail dans Power BI Service contenant rapports et datasets | Workspace "LAFABRIQUE BI" |
| **Dataset** | Modèle de données publié dans Power BI Service | Dataset "Données LAFABRIQUE" |
| **Report** | Rapport visuel (.pbix) contenant dashboards et graphiques | Rapport "Dashboard Direction" |

