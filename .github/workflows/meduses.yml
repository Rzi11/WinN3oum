### 🔐 SÉCURITÉ & GOUVERNANCE DES DONNÉES

#### GESTION DES DROITS D'ACCÈS

| Profil | Dashboards Accessibles | Niveau Accès | Filtres Automatiques |
|--------|------------------------|--------------|---------------------|
| **DG** | Tous (Direction, Commercial, Pédagogie, Finance) | Lecture totale | Aucun (vue globale) |
| **Dir. Commerciale** | Direction, Commercial | Lecture + Export | Par équipe commerciale |
| **Dir. Pédagogique** | Direction, Pédagogie | Lecture + Export | Par campus |
| **DAF** | Direction, Finance | Lecture + Modification | Aucun (vue globale) |
| **Dir. Scolarité** | Direction, Scolarité (non créé Phase 1) | Lecture | Par campus |
| **Commercial** | Commercial uniquement | Lecture | Son portefeuille uniquement (RLS) |
| **Chef Projet BI** | Tous + Administration | Écriture complète | Aucun |

**RLS (Row-Level Security) :**
- Commerciaux : Filtre automatique `[Commercial] = USERPRINCIPALNAME()`
- Directeurs Campus : Filtre `[Campus] IN ("Paris", "Lyon")`
- Implémentation via DAX dans Power BI Desktop

