## ANNEXE C : MATRICE DES RISQUES COMPLÈTE

### 🎯 MÉTHODOLOGIE D'ÉVALUATION

**Probabilité :**
- **Très Faible** : <10% | **Faible** : 10-30% | **Moyenne** : 30-60% | **Élevée** : 60-80% | **Très Élevée** : >80%

**Impact :**
- **Négligeable** : <5K€ | **Faible** : 5-20K€ | **Moyen** : 20-50K€ | **Élevé** : 50-100K€ | **Critique** : >100K€

**Criticité = Probabilité × Impact**

