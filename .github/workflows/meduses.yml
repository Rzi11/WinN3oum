### 🔄 FLUX DE DONNÉES DÉTAILLÉS

#### FLUX 1 : DONNÉES COMMERCIALES (PROSPECTS → INSCRITS)

```
[Fichiers Excel Commerciaux]
         ↓
[Migration one-shot vers SharePoint]
         ↓
[Nettoyage Power Query : Dédoublonnage, Standardisation]
         ↓
[Référentiel STATUT_PROSPECT validé]
         ↓
[Table Fact_Prospects dans modèle Power BI]
         ↓
[Dashboard Commercial]
```

**Fréquence :** Quotidienne (automatique via Power Automate)  
**Volumétrie :** ~8000 prospects/an = 24K lignes sur 3 ans  
**Transformations appliquées :**
- Dédoublonnage par Email + Téléphone
- Standardisation noms (MAJUSCULES → Capitalize)
- Mapping statuts vers référentiel unique (10 statuts)
- Calcul automatique du délai de conversion

---

#### FLUX 2 : DONNÉES SCOLARITÉ (ÉTUDIANTS)

```
[3 Bases Access Scolarité]
         ↓
[Export CSV mensuel (Phase 0)]
         ↓
[Consolidation Power Query : Fusion 3 bases]
         ↓
[Nettoyage : Résolution conflits, Référentiel STATUT_ETUDIANT]
         ↓
[Table Dim_Etudiant + Fact_Inscriptions]
         ↓
[Dashboards Direction, Scolarité, Finance]
```

**Migration vers SharePoint (Phase 1) :**
- Base Access 1 (Paris) → Liste SharePoint "Etudiants_Paris"
- Base Access 2 (Lyon) → Liste SharePoint "Etudiants_Lyon"
- Base Access 3 (Bordeaux) → Liste SharePoint "Etudiants_Bordeaux"
- Consolidation via Power Query vers table unique

**Fréquence :** Quotidienne (après migration SharePoint)  
**Volumétrie :** 2800 étudiants actuels + 5 ans historique = ~8500 lignes

---

#### FLUX 3 : DONNÉES FINANCIÈRES (SAGE)

```
[SAGE Comptabilité - Serveur local]
         ↓
[Data Gateway (VM dédiée) - Connexion sécurisée]
         ↓
[Extraction tables : Factures, Paiements, Charges]
         ↓
[Power Query : Jointures + Calculs marge]
         ↓
[Table Fact_Finances]
         ↓
[Dashboard Finance]
```

**Tables SAGE extraites :**
- `F_COMPTET` : Comptes clients (étudiants)
- `F_DOCENTETE` : Factures (entêtes)
- `F_DOCLIGNE` : Lignes de factures
- `F_ECRITURE` : Écritures comptables
- `F_REGLEMENTT` : Règlements

**Fréquence :** Quotidienne (extraction automatique 6h du matin)  
**Volumétrie :** ~15K factures/an

---

#### FLUX 4 : DONNÉES PÉDAGOGIQUES (PLANNING + ÉVALUATIONS)

```
[Fichier Excel Planning (Philippe)]
         ↓
[Migration SharePoint - Liste "Planning_Cours"]
         ↓
[Microsoft Forms : Évaluations post-cours]
         ↓
[Power Automate : Consolidation automatique]
         ↓
[Power Query : Croisement Planning × Évaluations]
         ↓
[Table Fact_Cours + Dim_Intervenant]
         ↓
[Dashboard Pédagogie]
```

**Fréquence :** 
- Planning : Hebdomadaire (mise à jour manuelle sur SharePoint)
- Évaluations : Temps réel (Forms → SharePoint automatique)

**Volumétrie :** ~2500 cours/an × 3 ans = 7500 lignes

