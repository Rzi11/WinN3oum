### 📋 RISQUES IDENTIFIÉS (15 RISQUES MAJEURS)

#### RISQUE R1 : Dépassement Budgétaire

| Élément | Description |
|---------|-------------|
| **ID** | R1 |
| **Catégorie** | Financier |
| **Description** | Le projet dépasse le budget initial de 216K€ |
| **Causes** | Complexité technique sous-estimée, périmètre qui dérive (scope creep), ressources pas disponibles |
| **Probabilité** | Moyenne (30%) |
| **Impact Brut** | Moyen (30K€) |
| **Criticité Brute** | Moyenne |
| **Mitigation** | • Forfait fixe 95K€ consulting (pas de régie)<br>• Contingence 12K€ (5%)<br>• Périmètre figé et validé COPIL<br>• Suivi budgétaire mensuel avec alertes |
| **Probabilité Résiduelle** | Faible (15%) |
| **Impact Résiduel** | Faible (10K€) |
| **Criticité Résiduelle** | Faible |
| **Responsable** | Chef de Projet BI |
| **Plan de Réponse** | Si dépassement >5% → COPIL extraordinaire + arbitrage DG |

