name: Méduses — dérive de la nuit

on:
  schedule:
    - cron: "30 3 * * *"     # chaque nuit à 4h30 heure tunisienne
  workflow_dispatch:          # bouton « Run workflow » pour lancer à la main
    inputs:
      mode:
        description: "normal = prévision + bancs + apprentissage ; rejeu = Djerba sur le passé ; validation = Tunisie-Sicile (~1 h) ; apprentissage = 2 h d'apprentissage méditerranéen ; connectivite = recalculer la carte d'où viennent les méduses (~2 h)"
        required: true
        default: normal
        type: choice
        options: [normal, rejeu, validation, apprentissage, connectivite]

permissions:
  contents: write

concurrency:
  group: meduses
  cancel-in-progress: false

jobs:
  derive:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: drift/requirements.txt

      - name: Installer les outils
        run: pip install -r drift/requirements.txt

      - name: Calculer la dérive des méduses
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUS_USER }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUS_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ "${{ github.event.inputs.mode }}" = "rejeu" ]; then
            python drift/run_drift.py --replay
          elif [ "${{ github.event.inputs.mode }}" = "validation" ]; then
            python drift/run_drift.py --validate
          elif [ "${{ github.event.inputs.mode }}" = "apprentissage" ]; then
            echo "apprentissage seul"
          elif [ "${{ github.event.inputs.mode }}" = "connectivite" ]; then
            python drift/connect.py --budget 140
          else
            python drift/run_drift.py
          fi

      - name: Carte « d'où viennent les méduses » (la première fois)
        if: github.event.inputs.mode == '' || github.event.inputs.mode == 'normal'
        continue-on-error: true
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUS_USER }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUS_PASSWORD }}
        run: |
          if [ ! -f data/connectivite.json ]; then python drift/connect.py --budget 60; else echo "déjà calculée"; fi

      - name: Apprendre sur la Méditerranée
        if: github.event.inputs.mode == '' || github.event.inputs.mode == 'normal' || github.event.inputs.mode == 'apprentissage'
        continue-on-error: true
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUS_USER }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUS_PASSWORD }}
        run: |
          if [ "${{ github.event.inputs.mode }}" = "apprentissage" ]; then
            python drift/learn.py --budget 120
          else
            python drift/learn.py --budget 25
          fi

      - name: Recalibrer les poids
        if: github.event.inputs.mode == '' || github.event.inputs.mode == 'normal' || github.event.inputs.mode == 'apprentissage'
        continue-on-error: true
        run: python drift/calibrate.py

      - name: Algues (prévision 7 jours + apprentissage sur les retours)
        if: github.event.inputs.mode == '' || github.event.inputs.mode == 'normal'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python drift/algues.py

      - name: Enregistrer le résultat
        run: |
          git config user.name  "winn3oum-bot"
          git config user.email "winn3oum-bot@users.noreply.github.com"
          git add data/
          git commit -m "Méduses et algues : mise à jour du $(date -u +%Y-%m-%d)" || echo "Rien de nouveau"
          git pull --rebase
          git push
