### 📊 FORMULES DAX CLÉS

| Formule | Code DAX | Explication |
|---------|----------|-------------|
| **Taux de Conversion** | `DIVIDE([Inscrits], [Prospects], 0)` | Divise inscrits par prospects (0 si division par zéro) |
| **CA Total** | `SUM(Fact_Inscriptions[CA])` | Somme du chiffre d'affaires |
| **Marge Nette** | `[CA Total] - [Coûts Totaux]` | Différence entre revenus et coûts |
| **Taux de Marge** | `DIVIDE([Marge Nette], [CA Total], 0)` | Marge en % du CA |
| **CA Année Précédente** | `CALCULATE([CA Total], SAMEPERIODLASTYEAR(Dim_Temps[Date]))` | CA de la même période l'année dernière |
| **Évolution CA** | `DIVIDE([CA Total] - [CA N-1], [CA N-1], 0)` | Croissance du CA en % |
| **Nombre Distinct Étudiants** | `DISTINCTCOUNT(Fact_Inscriptions[EtudiantKey])` | Compte les étudiants uniques |
| **CA Cumulé** | `CALCULATE([CA Total], DATESYTD(Dim_Temps[Date]))` | Cumul du CA depuis début d'année |

