| **SAGE Comptabilité** | Quotidien (IT) | 30 jours | Service IT |
| **Modèle de données** | À chaque publication | Versions illimitées | Power BI Service |
| **Documentation** | À chaque modification | Infini (SharePoint) | Chef Projet BI |

**Plan de Restauration (RPO/RTO) :**
